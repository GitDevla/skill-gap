services:
  app:
    build: .
    environment:
      POSTGRES_DSN: postgresql://skill:skill@postgres:5432/skill
      MONGO_URI: mongodb://skill:skill@mongo:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: skill
      POSTGRES_PASSWORD: skill
      POSTGRES_DB: skill
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skill"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: skill
      MONGO_INITDB_ROOT_PASSWORD: skill
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.10.2
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/skill-pass
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "skill-pass", "RETURN 1"]
      interval: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6336:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  neo4j-data:
  qdrant-data:
